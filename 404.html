<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <title>Error 404</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    .box{text-align:center}
    .code{font-size:44px;font-weight:700;line-height:1.1;margin:0 0 12px}
    .text{font-size:18px;margin:0;color:#333}
  </style>
</head>
<body>
  <main class="page">
    <div class="box">
      <h1 class="code">Error 404</h1>
      <p class="text">Page not found.</p>
    </div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope:'/'}).catch(function(){});
    }
  </script>
</body>
</html>
